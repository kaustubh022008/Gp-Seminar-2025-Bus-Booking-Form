<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INTERNATIONAL SAHAJA YOGA CHRISTMAS PUJA AND SEMINAR 2025 AC BUS BOOKING FORM</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f7f7f7;
      padding: 20px;
    }
    h2 {
      text-align: center;
      color: #222;
      margin-bottom: 20px;
    }
    form {
      background-color: #fff;
      border-radius: 15px;
      padding: 25px;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
      color: #333;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      margin-top: 20px;
      width: 100%;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <h2>INTERNATIONAL SAHAJA YOGA CHRISTMAS PUJA AND SEMINAR 2025<br>AC BUS BOOKING FORM</h2>

  <form id="busForm">
    <label>Full Name:</label>
    <input type="text" id="name" required>

    <label>Number of Seats:</label>
    <input type="number" id="seats" required min="1" oninput="updateAmount()">

    <label>Passenger Names (as per seats):</label>
    <textarea id="passengerNames" rows="3" placeholder="Enter passenger names separated by commas"></textarea>

    <label>Pickup Location:</label>
    <input type="text" id="pickup" required>

    <label>Contact Number:</label>
    <input type="tel" id="contact" required>

    <label>Total Amount (₹2200 per seat):</label>
    <input type="number" id="amount" readonly>

    <button type="button" onclick="makePayment()">Proceed to Pay</button>
  </form>

  <script>
    function updateAmount() {
      const seats = document.getElementById("seats").value;
      const amount = seats * 2200;
      document.getElementById("amount").value = amount || 0;
    }

    function makePayment() {
      const amount = document.getElementById("amount").value;
      const name = document.getElementById("name").value;

      if (!name || amount <= 0) {
        alert("Please enter your name and number of seats.");
        return;
      }

      // Your actual UPI-linked mobile number
      const mobileNumber = "9594696790";

      // Create UPI payment link using mobile number
      const upiLink = `upi://pay?pa=${mobileNumber}@upi&pn=Vikas%20Bhor&am=${amount}&cu=INR&tn=Bus%20Booking`;

      // Open the UPI app for payment
      window.location.href = upiLink;
    }
  </script>

</body>
  </html>
